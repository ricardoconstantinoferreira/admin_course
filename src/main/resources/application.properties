spring.config.import=optional:file:.env[.properties]

spring.application.name=admin
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

security.jwt.secret: ${JWT_SECRET:}
security.jwt.issuer: ${JWT_ISSUER:ferreiracurso-admin}
security.jwt.expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${EMAIL_SMTP_FROM}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
mail.from.name=Ferreira Curso
mail.logo=${EMAIL_LOGO}

resend.api.key=${RESEND_API_KEY}
resend.domain=${RESEND_DOMAIN}
